plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.62'
}

platform {
    fabric {
        loaderVersion = rootProject.property('fabric.loader.version')
        apiVersion = rootProject.property('fabric.api.version')
    }
}

tableau {
    project {
        group = "com.communi-suggestu.saecularia-caudices"
        publisher = "communi-suggestu"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('communi-suggestu-saecularia-caudices')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}