pluginManagement {
    repositories {
        mavenLocal()
        maven {
            url 'https://ldtteam.jfrog.io/artifactory/communi-suggestu-maven'
            name 'Communi-Suggestu Maven'
        }
        maven {
            url 'https://ldtteam.jfrog.io/artifactory/tableau'
            name 'Tableau Maven'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'com.communi-suggestu.placitum' version '0.0.70'
}

rootProject.name = "saecularia-caudices"

platforms {
    core(':core')
    modernFabric(':fabric')
    neoforge(':neoforge')

    defaults {
        java {
            version = 25
        }
        project {
            modId = "saecularia-caudices"
            owner = "communi-suggestu"
        }
    }
}