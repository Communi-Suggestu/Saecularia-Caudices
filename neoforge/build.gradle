plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.75'
}

repositories {
    maven {
        name = "Maven for PR #2815" // https://github.com/neoforged/NeoForge/pull/2815
        url = uri("https://prmaven.neoforged.net/NeoForge/pr2815")
        content {
            includeModule("net.neoforged", "neoforge")
            includeModule("net.neoforged", "testframework")
        }
    }
}

tableau {
    project {
        group = "com.communi-suggestu.saecularia-caudices"
        publisher = "communi-suggestu"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('communi-suggestu-saecularia-caudices')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}