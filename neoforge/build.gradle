plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.91'
}

repositories {
    maven {
        name = "NeoForge"
        url = uri("https://maven.neoforged.net/releases")
    }
}

tableau {
    project {
        group = "com.communi-suggestu.saecularia-caudices"
        publisher = "communi-suggestu"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('communi-suggestu-saecularia-caudices')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}